[workspace]
resolver = "2"
members = ["treasury"]

[workspace.dependencies]
soroban-sdk = "27.0.2"

# Release profile tuned for on-chain wasm: small binaries, no panic machinery.
# `overflow-checks = true` is deliberate and must NOT be removed -- see note in
# storage.rs about arithmetic on running totals.
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
